<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lomba Desain Website AI</title>
<style>
:root{--bg:#050f2e;--line:rgba(110,160,255,.4);--tx:#fff;--mut:#a9bdf0;--acc:#3b82f6;--ok:#22e06b;--warn:#ffd21a;--bad:#ff4d6d;
--c1:#22d3ee;--c2:#2df2b0;--c3:#ffd91a;--c4:#ff4fd8;--c5:#b472ff;
--f1:#0a4fe0;--f2:#0b8a73;--f3:#a07a05;--f4:#a3158f;--f5:#5a28c4;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;
background:radial-gradient(1200px 500px at 20% 0,#0b3bb5 0,transparent 60%),radial-gradient(900px 400px at 100% 100%,#0a2a8a 0,transparent 60%),linear-gradient(#061540,#040c26)}
.banner{flex:none;height:clamp(96px,19vh,220px);display:flex;align-items:center;gap:clamp(8px,1.5vw,24px);padding:0 0 0 2vw;overflow:hidden;background:linear-gradient(90deg,#0a2f9e,#0a1f70 45%,#0b36b8);border-bottom:1px solid var(--line)}
.logo{height:78%;width:auto;flex:none;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.ttl{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5vh}
.rib1,.rib2{transform:skew(-12deg);font-weight:800;font-style:italic;white-space:nowrap;line-height:1.2;border-radius:6px}
.rib1{background:linear-gradient(#fff,#cfd8ee);color:#0a1a4d;font-size:clamp(11px,3.2vh,30px);padding:.2em 1.2em;box-shadow:0 0 14px rgba(120,170,255,.6)}
.rib2{background:#ffd21a;color:#14213d;font-size:clamp(9px,2.2vh,20px);padding:.15em 1.2em}
.banner h1{margin:0;font-size:clamp(20px,6.2vh,64px);font-style:italic;font-weight:900;line-height:1.1;text-shadow:0 0 18px #3b82f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sub{margin:0;font-style:italic;font-size:clamp(10px,2.2vh,20px);color:#dbe7ff}
.robot{height:100%;width:auto;flex:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%);mask-image:linear-gradient(90deg,transparent,#000 24%)}
.toolbar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 1.4vw;flex-wrap:wrap}
.tabs{margin-left:auto}
.pill{flex:1;min-width:0;background:rgba(20,50,130,.55);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:clamp(11px,2vh,16px);color:#dbe7ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill:empty{visibility:hidden}
button{font:inherit;color:var(--tx);background:rgba(20,50,130,.55);border:1px solid var(--line);border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:clamp(12px,2vh,17px)}
button:hover{border-color:#8fb4ff;box-shadow:0 0 12px rgba(80,140,255,.5)}
button.on{background:#3b82f6;border-color:#8fb4ff;box-shadow:0 0 14px rgba(59,130,246,.8)}
button.go{background:linear-gradient(#3dff7a,#12c24a);border-color:#8bffb0;color:#04301a;font-weight:800;box-shadow:0 0 16px rgba(34,224,107,.6)}
button.stop{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:800}
button:disabled{opacity:.6;cursor:default}
body[data-tab="t"] .onlyU{display:none}
main{flex:1;min-height:0;position:relative}
section{position:absolute;inset:0;padding:4px 1.4vw 1.6vh;display:none;flex-direction:column;gap:12px}
section.show{display:flex}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:1.1vw}
.col{background:linear-gradient(165deg,var(--cf),color-mix(in srgb,var(--cf) 30%,#030a20));border:3px solid var(--cc);border-radius:24px;box-shadow:0 0 18px var(--cc),inset 0 0 26px color-mix(in srgb,var(--cc) 45%,transparent);display:flex;flex-direction:column;min-height:0}
.hd{display:flex;align-items:center;gap:10px;padding:12px 12px 4px}
.num{flex:none;width:clamp(30px,6vh,56px);height:clamp(30px,6vh,56px);border-radius:50%;background:var(--cc);color:#08122e;display:grid;place-items:center;font-size:clamp(16px,3.6vh,34px);font-weight:900;box-shadow:0 0 14px var(--cc)}
.col h2{margin:0;font-size:clamp(14px,2.8vh,26px);line-height:1.15}
.n{padding:4px 14px 8px;font-size:clamp(11px,1.9vh,16px);color:#e6eeff}
.n::before{content:"👥 "}
.chips{padding:0 12px 12px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow:auto;flex:1}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:9px;padding:3px 10px;font-size:clamp(11px,2vh,18px);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#timer{align-items:center;justify-content:center;text-align:center}
#tTitle{font-size:clamp(18px,4vh,40px);font-weight:700;margin:0}
#digits{font-variant-numeric:tabular-nums;font-weight:800;line-height:1;font-size:min(27vh,17vw);letter-spacing:.02em;text-shadow:0 0 30px #3b82f6;transition:color .3s}
#digits.warn{color:var(--warn);text-shadow:0 0 30px #ffd21a88}#digits.bad{color:var(--bad);text-shadow:0 0 30px #ff4d6d88}
#digits.end{color:var(--bad);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#prog{width:min(80vw,1100px);height:14px;border-radius:99px;background:rgba(20,50,130,.55);border:1px solid var(--line);overflow:hidden}
#progIn{height:100%;width:100%;background:var(--ok);transition:width .3s linear,background .3s}
#status{color:var(--mut);font-size:clamp(13px,2.2vh,20px);min-height:1.4em}
#subm{display:flex;gap:12px;align-items:baseline;justify-content:center;flex-wrap:wrap;font-size:clamp(16px,3.6vh,36px)}
#subm span{color:var(--mut)}
#lnk{color:#7fb0ff;font-weight:800;text-decoration:none;border-bottom:3px solid #7fb0ff}
dialog{background:#0c1d57;color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(900px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:#06143f;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.row{display:flex;gap:10px;align-items:end}
@media (max-width:800px){.robot,.logo{display:none}.cols{grid-template-columns:repeat(2,1fr);overflow:auto}.g5{grid-template-columns:1fr 1fr}}
</style>
</head>

<main>

    <div class="cols" id="cols"></div>
  </section>

    <p id="tTitle">Waktu Mengerjakan</p>
    <div id="digits">60:00</div>
    <div id="prog"><div id="progIn"></div></div>

    <div class="bar" style="justify-content:center">

<dialog id="dlg">
  <h2 style="margin:0 0 4px">Pengaturan</h2>
  <label>Judul acara</label><input id="fTitle">
  <label>Link pengumpulan karya (tampil di bawah timer; kosongkan untuk menyembunyikan)</label><input id="fLink" placeholder="https://...">
  <label>5 tema (isi manual)</label>
  <div class="g5" id="fThemes"></div>
  <label>Daftar siswa, satu nama per baris (kosongkan untuk memakai nomor urut)</label>
  <textarea id="fNames" rows="8" placeholder="Contoh:&#10;Andi&#10;Budi&#10;Citra"></textarea>
  <div class="row">
    <div style="flex:1"><label>Jumlah siswa jika memakai nomor</label><input id="fCount" type="number" min="1" max="200" value="40"></div>
    <div style="flex:1"><label>Durasi lomba (menit)</label><input id="fMin" type="number" min="1" max="600" value="60"></div>
    <button id="fSave" class="go">Simpan</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const DEF={link:"https://bit.ly/lombawebsiteai",title:"Lomba Desain Website AI",themes:["Website Pendidikan","Website Kampanye Sosial","Website Kampanye Lingkungan","Website Promosi Budaya/Produk Lokal","Website Pariwisata/Destinasi Lokal"],names:"",count:40,min:60};
let S=Object.assign({},DEF);
try{const r=localStorage.getItem("undiTimer");if(r)S=Object.assign({},DEF,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("undiTimer",JSON.stringify(S))}catch(e){}}

/* tabs */
function tab(t){document.body.dataset.tab=t;$("#undi").classList.toggle("show",t==="u");$("#timer").classList.toggle("show",t==="t");
 $("#tabU").classList.toggle("on",t==="u");$("#tabT").classList.toggle("on",t==="t")}
$("#tabU").onclick=()=>tab("u");$("#tabT").onclick=()=>tab("t");
$("#btnFs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

/* settings */
function students(){const l=S.names.split("\n").map(x=>x.trim()).filter(Boolean);
 return l.length?l:Array.from({length:S.count},(_,i)=>"No. "+(i+1))}
function fill(){$("#fTitle").value=S.title;$("#fLink").value=S.link;$("#fNames").value=S.names;$("#fCount").value=S.count;$("#fMin").value=S.min;
 $("#fThemes").innerHTML="";S.themes.forEach((t,i)=>{const e=document.createElement("input");e.value=t;e.dataset.i=i;e.placeholder="Tema "+(i+1);$("#fThemes").appendChild(e)})}
$("#btnSet").onclick=()=>{fill();$("#dlg").showModal()};
$("#fSave").onclick=()=>{
 S.title=$("#fTitle").value.trim()||DEF.title;S.link=$("#fLink").value.trim();
 S.themes=[...document.querySelectorAll("#fThemes input")].map((e,i)=>e.value.trim()||"Tema "+(i+1));
 S.names=$("#fNames").value;S.count=Math.max(1,Math.min(200,+$("#fCount").value||40));
 S.min=Math.max(1,Math.min(600,+$("#fMin").value||60));
 save();$("#dlg").close();apply();resetTimer(S.min*60)};

/* undi */
let timers=[];
function render(cols,reveal){
 const box=$("#cols");box.innerHTML="";
 cols.forEach((arr,i)=>{
  const c=document.createElement("div");c.className="col";c.style.setProperty("--cc","var(--c"+(i+1)+")");c.style.setProperty("--cf","var(--f"+(i+1)+")");
  c.innerHTML='<div class="hd"><b class="num"></b><h2></h2></div><div class="n"></div><div class="chips"></div>';
  c.querySelector("h2").textContent=S.themes[i];c.querySelector(".num").textContent=i+1;
  box.appendChild(c);
 });
 return box.querySelectorAll(".col");
}
function showEmpty(){
 const cs=render([[],[],[],[],[]]);
 cs.forEach((c,i)=>c.querySelector(".n").textContent="0 siswa");
 const n=students().length;
 $("#info").textContent=n+" siswa · 5 tema · pembagian acak, selisih antar tema maksimal 1 orang";
}
function draw(){
 timers.forEach(clearInterval);timers=[];
 const list=students();
 for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
 const cols=[[],[],[],[],[]];list.forEach((n,i)=>cols[i%5].push(n));
 const cs=render(cols);let k=0;const order=list.map((n,i)=>i);
 $("#btnDraw").disabled=true;
 const gap=Math.max(60,Math.min(250,6000/list.length));
 const t=setInterval(()=>{
  if(k>=list.length){clearInterval(t);$("#btnDraw").disabled=false;$("#btnDraw").textContent="Undi Ulang";return}
  const col=k%5,name=list[k];
  const ch=document.createElement("span");ch.className="chip";ch.textContent=name;
  cs[col].querySelector(".chips").appendChild(ch);
  cs[col].querySelector(".n").textContent=cols[col].slice(0,Math.floor(k/5)+1).length+" / "+cols[col].length+" siswa";
  k++;
 },gap);
 timers.push(t);
}
$("#btnDraw").onclick=draw;

/* timer */
let total=S.min*60,left=total,endAt=0,run=false,tick=null,ac=null;
const pad=n=>String(n).padStart(2,"0");
function fmt(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?pad(h)+":":"")+pad(m)+":"+pad(s%60)}
function paint(){
 const d=$("#digits");d.textContent=fmt(left);
 d.className=left<=0?"end":left<=60?"bad":left<=300?"warn":"";
 const p=total?Math.max(0,left/total)*100:0;$("#progIn").style.width=p+"%";
 $("#progIn").style.background=left<=60?"var(--bad)":left<=300?"var(--warn)":"var(--ok)";
 $("#status").textContent=left<=0?"WAKTU HABIS — simpan dan kumpulkan pekerjaan":left<=60?"Kurang dari 1 menit":left<=300?"Sisa 5 menit terakhir":run?"Sedang berjalan":"Siap dimulai";
}
function beep(n,f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
 const t=ac.currentTime+i*.35;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}}catch(e){}}
let lastWarn=null;
function loop(){
 left=(endAt-Date.now())/1000;
 const sec=Math.ceil(left);
 if(sec!==lastWarn){lastWarn=sec;if(sec===300||sec===60)beep(2,880);}
 if(left<=0){left=0;run=false;clearInterval(tick);beep(4,660);$("#bStart").textContent="Mulai";$("#bStart").className="go"}
 paint();
}
function startPause(){
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 if(left<=0)return;
 if(run){run=false;clearInterval(tick);$("#bStart").textContent="Lanjut";$("#bStart").className="go"}
 else{run=true;endAt=Date.now()+left*1000;tick=setInterval(loop,200);$("#bStart").textContent="Jeda";$("#bStart").className="stop"}
 paint();
}
function resetTimer(sec){run=false;clearInterval(tick);total=sec;left=sec;lastWarn=null;$("#bStart").textContent="Mulai";$("#bStart").className="go";paint()}
function adj(sec){total=Math.max(60,total+sec);left=Math.max(0,left+sec);if(run)endAt+=sec*1000;paint()}
$("#bStart").onclick=startPause;
$("#bReset").onclick=()=>resetTimer(S.min*60);
$("#bM1").onclick=()=>adj(-60);$("#bP1").onclick=()=>adj(60);
[15,30,45,60,90,120].forEach(m=>{const b=document.createElement("button");b.textContent=m+" mnt";b.onclick=()=>{S.min=m;save();resetTimer(m*60)};$("#presets").appendChild(b)});
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;if(e.code==="Space"&&$("#timer").classList.contains("show")){e.preventDefault();startPause()}});

function apply(){const L=(S.link||"").trim(),box=$("#subm");
 if(L){const u=/^https?:\/\//i.test(L)?L:"https://"+L;$("#lnk").href=u;$("#lnk").textContent=u.replace(/^https?:\/\//i,"");box.style.display=""}else box.style.display="none";
 $("#hTitle").textContent=S.title;document.title=S.title;showEmpty();$("#btnDraw").textContent="Undi Sekarang"}
apply();resetTimer(S.min*60);
</script>
